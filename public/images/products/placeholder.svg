<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Transparent Background -->
  <rect width="600" height="600" fill="none"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="300" cy="270" r="200" fill="url(#glowGrad)"/>

  <!-- Pharmaceutical Packaging / Pill Capsule Icon Container -->
  <g transform="translate(300, 240)">
    <!-- Pill Capsule Container Graphic (Frosted Glass Badge) -->
    <rect x="-100" y="-100" width="200" height="200" rx="36" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    
    <!-- Stylized Medical Cross & Molecule -->
    <g transform="translate(0, -10)">
      <!-- Central Pill / Shield -->
      <path d="M-30,-20 C-30,-35 30,-35 30,-20 L30,20 C30,35 -30,35 -30,20 Z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#ffffff" stroke-width="3"/>
      <circle cx="-12" cy="-10" r="4" fill="#ffffff"/>
      <circle cx="12" cy="10" r="4" fill="#7ff2d9"/>

      <!-- Cross sparkle accents -->
      <path d="M-50, -40 L-50, -20 M-60, -30 L-40, -30" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
      <path d="M50, 20 L50, 40 M40, 30 L60, 30" stroke="#7ff2d9" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    </g>
    
    <!-- Clean Badge Tag -->
    <rect x="-75" y="55" width="150" height="26" rx="13" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="0" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">OFFICIAL FORMULATION</text>
  </g>

  <!-- Typography in crisp white -->
  <text x="300" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Packaging Visual Coming Soon</text>
  <text x="300" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="rgba(255,255,255,0.85)" text-anchor="middle" letter-spacing="0.2">Phasecor Healthcare Formulation</text>

  <!-- Bottom Brand Indicator -->
  <g transform="translate(300, 520)">
    <line x1="-40" y1="0" x2="40" y2="0" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>
</svg>
